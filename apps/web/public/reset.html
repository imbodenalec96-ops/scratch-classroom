<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resetting Scratch Classroom…</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(800px 600px at 0% 0%, rgba(168,85,247,0.22) 0%, transparent 55%),
                  radial-gradient(700px 500px at 100% 100%, rgba(236,72,153,0.18) 0%, transparent 55%),
                  linear-gradient(180deg, #1a0f2e 0%, #0a0414 100%);
      color: #fce7f3;
      min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .card {
      max-width: 480px; width: 100%;
      padding: 28px 26px;
      border-radius: 18px;
      background: rgba(168,85,247,0.10);
      border: 1px solid rgba(168,85,247,0.30);
      box-shadow: 0 24px 56px -10px rgba(168,85,247,0.45);
    }
    .pill {
      display: inline-block; padding: 4px 12px; border-radius: 999px;
      background: linear-gradient(135deg, rgba(236,72,153,0.20), rgba(168,85,247,0.10));
      border: 1px solid rgba(168,85,247,0.30);
      color: #f9a8d4;
      font-size: 10px; font-weight: 800; letter-spacing: 0.28em; text-transform: uppercase;
    }
    h1 {
      margin: 10px 0 6px; font-size: 24px; letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f5f1e8 0%, #c4b5fd 50%, #f9a8d4 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .sub { font-size: 13px; color: rgba(196,181,253,0.75); font-weight: 500; line-height: 1.5; }
    ul { font-size: 12px; color: rgba(196,181,253,0.85); padding-left: 20px; line-height: 1.7; margin: 12px 0 0; }
    ul li { margin: 0; }
    ul li.done::before { content: "✓ "; color: #86efac; font-weight: 800; }
    ul li.pending::before { content: "… "; color: #fbbf24; }
    ul li.fail::before { content: "✗ "; color: #fca5a5; }
    .dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #ec4899; margin-right: 8px; vertical-align: middle;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.3); }
    }
    code { font-family: Menlo, Monaco, monospace; color: #f9a8d4; font-size: 11px; }
    .go-btn {
      margin-top: 16px;
      padding: 12px 18px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      color: white; font-weight: 800; font-size: 14px;
      cursor: pointer; width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="pill"><span class="dot"></span>Resetting</div>
    <h1>Wiping cache…</h1>
    <div class="sub">
      Clearing service workers, browser cache, and local storage so the app loads fresh next time.
      Stays logged in.
    </div>
    <ul id="steps">
      <li id="s-sw" class="pending">Unregister service workers</li>
      <li id="s-caches" class="pending">Clear Cache API entries</li>
      <li id="s-bundle" class="pending">Bust HTML cache</li>
      <li id="s-bcDB" class="pending">Force-reseed barcode DB on next load</li>
    </ul>
    <button id="go" class="go-btn" style="display:none">Open Scratch Classroom →</button>
  </div>

  <script>
    (async function () {
      const mark = (id, ok) => {
        const el = document.getElementById(id);
        if (el) el.className = ok ? "done" : "fail";
      };

      // 1. Unregister any service workers
      try {
        if ("serviceWorker" in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        }
        mark("s-sw", true);
      } catch { mark("s-sw", false); }

      // 2. Clear Cache API
      try {
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
        mark("s-caches", true);
      } catch { mark("s-caches", false); }

      // 3. Mark cache-bust complete (the redirect query string busts CDN caching anyway)
      mark("s-bundle", true);

      // 4. Wipe star_bcdb so the new bundle's seeds populate fresh
      //    (preserves all other STAR data — students, IEP, photos, etc.)
      try {
        localStorage.removeItem("star_bcdb");
        mark("s-bcDB", true);
      } catch { mark("s-bcDB", false); }

      // Auto-redirect after 1.5s with a cache-busting query, OR show button.
      const target = "/star?freshFromReset=" + Date.now();
      const btn = document.getElementById("go");
      btn.style.display = "block";
      btn.onclick = () => location.replace(target);
      setTimeout(() => { try { location.replace(target); } catch {} }, 1500);
    })();
  </script>
</body>
</html>
