name: Desktop Builds (.dmg + .exe)

# When this runs:
#   • Manually from the Actions tab → Run workflow
#   • Automatically when you push a tag like "desktop-v1.0.0"
#
# What you get:
#   • A "Scratch Classroom-1.0.0.dmg" artifact (Mac, universal x64+arm64)
#   • A "Scratch Classroom Setup 1.0.0.exe" artifact (Windows x64)
#   • Both downloadable from the Actions run summary page
#   • If triggered by a tag, also attached to a GitHub Release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    name: Build for ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: build:mac
            artifact-name: scratch-classroom-mac
            artifact-path: apps/desktop/dist/*.dmg
          - os: windows-latest
            target: build:win
            artifact-name: scratch-classroom-win
            artifact-path: apps/desktop/dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Skip the orphan .claude/worktrees/tender-pike gitlink that
          # has no .gitmodules entry — it would otherwise fail checkout
          # with "fatal: no submodule mapping found" (exit 128).
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      # Skip the root workspace install entirely — npm hoists app-builder-bin
      # and silently drops its postinstall, so the helper binary is never
      # downloaded and electron-builder fails with ENOENT.
      # Installing inside apps/desktop with --no-workspaces creates a real
      # local node_modules with all postinstall scripts firing properly.
      - name: Install desktop deps (standalone)
        working-directory: apps/desktop
        run: npm install --no-workspaces --no-audit --no-fund --foreground-scripts

      # Belt-and-suspenders: explicitly rebuild app-builder-bin in case
      # npm STILL skipped its postinstall in some edge case.
      - name: Force-trigger app-builder-bin postinstall
        working-directory: apps/desktop
        run: npm rebuild app-builder-bin --foreground-scripts

      - name: Verify helper binary actually downloaded
        working-directory: apps/desktop
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            ls -la node_modules/app-builder-bin/mac/ || (echo "::error::Mac helper missing" && exit 1)
          elif [ "${{ runner.os }}" = "Windows" ]; then
            ls -la node_modules/app-builder-bin/win/x64/ || (echo "::error::Win helper missing" && exit 1)
          fi

      - name: Generate icons
        working-directory: apps/desktop
        run: node build/make-icons.js

      - name: Build installer
        working-directory: apps/desktop
        env:
          GH_TOKEN: ""
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.target }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach installers to a Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create release with installers
        uses: softprops/action-gh-release@v2
        with:
          name: "Scratch Classroom Desktop ${{ github.ref_name }}"
          body: |
            Desktop installers for **Scratch Classroom**.

            ## Download
            - **Mac** (Apple Silicon + Intel) — grab the `.dmg`
            - **Windows** (x64) — grab the `.exe`

            Both wrap the live website at https://scratch-classroom.vercel.app/, so updates land automatically — no separate version management.

            ## First-run notes
            - **Mac**: right-click → Open the first time (Gatekeeper warning since the build isn't code-signed)
            - **Windows**: click "More info → Run anyway" on the SmartScreen popup
          files: |
            artifacts/scratch-classroom-mac/*
            artifacts/scratch-classroom-win/*
          fail_on_unmatched_files: false
