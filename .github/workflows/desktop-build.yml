name: Desktop Builds (.dmg + .exe)

# When this runs:
#   • Manually from the Actions tab → Run workflow
#   • Automatically when you push a tag like "desktop-v1.0.0"
#
# What you get:
#   • A "Scratch Classroom-1.0.0.dmg" artifact (Mac, universal x64+arm64)
#   • A "Scratch Classroom Setup 1.0.0.exe" artifact (Windows x64)
#   • Both downloadable from the Actions run summary page
#   • If triggered by a tag, also attached to a GitHub Release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    name: Build for ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: build:mac
            artifact-name: scratch-classroom-mac
            artifact-path: apps/desktop/dist/*.dmg
          - os: windows-latest
            target: build:win
            artifact-name: scratch-classroom-win
            artifact-path: apps/desktop/dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Skip the orphan .claude/worktrees/tender-pike gitlink that
          # has no .gitmodules entry — it would otherwise fail checkout
          # with "fatal: no submodule mapping found" (exit 128).
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root deps
        run: npm install --no-audit --no-fund

      # npm workspaces silently skips the postinstall on hoisted packages,
      # so app-builder-bin/{mac,win}/<binary> never gets downloaded → the
      # build fails with ENOENT spawning the helper. Force-rebuild to
      # trigger the install.js for these specific packages.
      - name: Rebuild native binaries (app-builder-bin, etc)
        run: |
          npm rebuild app-builder-bin
          npm rebuild --workspace=@scratch/desktop

      - name: Generate icons
        working-directory: apps/desktop
        run: node build/make-icons.js

      - name: Build installer
        working-directory: apps/desktop
        env:
          # electron-builder reaches GitHub for code-signing and update
          # metadata; without a token we just skip publishing.
          GH_TOKEN: ""
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.target }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach installers to a Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create release with installers
        uses: softprops/action-gh-release@v2
        with:
          name: "Scratch Classroom Desktop ${{ github.ref_name }}"
          body: |
            Desktop installers for **Scratch Classroom**.

            ## Download
            - **Mac** (Apple Silicon + Intel) — grab the `.dmg`
            - **Windows** (x64) — grab the `.exe`

            Both wrap the live website at https://scratch-classroom.vercel.app/, so updates land automatically — no separate version management.

            ## First-run notes
            - **Mac**: right-click → Open the first time (Gatekeeper warning since the build isn't code-signed)
            - **Windows**: click "More info → Run anyway" on the SmartScreen popup
          files: |
            artifacts/scratch-classroom-mac/*
            artifacts/scratch-classroom-win/*
          fail_on_unmatched_files: false
